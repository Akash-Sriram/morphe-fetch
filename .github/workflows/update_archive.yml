name: Process and Index Morphe Archive

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update_archive.yml'
      - 'scripts/process_archive.py'
      - 'scripts/archive_aggregator.py'
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-archive-updated]

permissions:
  contents: write

jobs:
  process-archive:
    name: Process Archive & Index Features
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Process Archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/process_archive.py "" data/processed_archive.json

      - name: Commit and Push Processed Archive to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/processed_archive.min.json app/src/main/assets/morphe_archive_bundled.json

          if git diff --staged --quiet; then
            echo "No changes in archive data detected."
          else
            git commit -m "chore(data): update processed archive index [$(date -u +'%Y-%m-%d %H:%M UTC')] [skip ci]"
            git push origin main
          fi

