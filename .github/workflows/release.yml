name: Build and Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.2 or v5.1.0). Leave blank to use gradle.properties."
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Determine release version and tag
        id: release_info
        shell: bash
        run: |
          input_tag="${{ inputs.tag }}"
          if [[ -n "$input_tag" ]]; then
            tag="$input_tag"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            prop_version=$(grep '^helperVersionName=' gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
            tag="v${prop_version:-1.0.2}"
          fi

          if [[ ! "$tag" =~ ^v ]]; then
            tag="v$tag"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          version_name="${tag#v}"
          version_core="${version_name%%[-+]*}"
          IFS='.' read -r major minor patch _ <<< "$version_core"
          major="${major:-0}"
          minor="${minor:-0}"
          patch="${patch:-0}"
          version_code=$((major * 1000000 + minor * 10000 + patch * 100))

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Release Tag: $tag"
          echo "Version Name: $version_name"
          echo "Version Code: $version_code"

      - name: Decode release signing keystore
        id: signing
        env:
          HELPER_RELEASE_KEYSTORE_BASE64: ${{ secrets.HELPER_RELEASE_KEYSTORE_BASE64 }}
          HELPER_RELEASE_STORE_PASSWORD: ${{ secrets.HELPER_RELEASE_STORE_PASSWORD }}
          HELPER_RELEASE_KEY_ALIAS: ${{ secrets.HELPER_RELEASE_KEY_ALIAS }}
          HELPER_RELEASE_KEY_PASSWORD: ${{ secrets.HELPER_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          missing=0
          for name in \
            HELPER_RELEASE_KEYSTORE_BASE64 \
            HELPER_RELEASE_STORE_PASSWORD \
            HELPER_RELEASE_KEY_ALIAS \
            HELPER_RELEASE_KEY_PASSWORD
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: ${name}"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Please configure all 4 release signing secrets in repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/signing"
          store_file="$RUNNER_TEMP/signing/helper-release.jks"
          printf '%s' "$HELPER_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$store_file"
          echo "store_file=$store_file" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          HELPER_RELEASE_STORE_FILE: ${{ steps.signing.outputs.store_file }}
          HELPER_RELEASE_STORE_PASSWORD: ${{ secrets.HELPER_RELEASE_STORE_PASSWORD }}
          HELPER_RELEASE_KEY_ALIAS: ${{ secrets.HELPER_RELEASE_KEY_ALIAS }}
          HELPER_RELEASE_KEY_PASSWORD: ${{ secrets.HELPER_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease \
            -PhelperVersionName="${{ steps.release_info.outputs.version_name }}" \
            -PhelperVersionCode="${{ steps.release_info.outputs.version_code }}" \
            --no-daemon --stacktrace

      - name: Prepare distribution artifacts & checksums
        id: artifacts
        shell: bash
        run: |
          tag="${{ steps.release_info.outputs.tag }}"
          mkdir -p dist
          apk_target="dist/morphe-fetch-${tag}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk_target"

          cd dist
          sha256sum "morphe-fetch-${tag}.apk" > "morphe-fetch-${tag}.apk.sha256"
          cd ..

          echo "apk_path=$apk_target" >> "$GITHUB_OUTPUT"
          echo "checksum_path=dist/morphe-fetch-${tag}.apk.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload artifact to workflow summary
        uses: actions/upload-artifact@v4
        with:
          name: morphe-fetch-${{ steps.release_info.outputs.tag }}
          path: dist/
          retention-days: 30

      - name: Generate release notes
        shell: bash
        run: |
          tag="${{ steps.release_info.outputs.tag }}"
          previous_tag="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"

          {
            echo "## Morphe Fetch ${tag}"
            echo
            echo "### What's Changed"
            if [[ -n "$previous_tag" ]]; then
              echo "Changes since ${previous_tag}:"
              git log --pretty=format:"* %s (%h)" "${previous_tag}..HEAD"
            else
              git log --pretty=format:"* %s (%h)" -n 25
            fi
            echo
            echo
            echo "### Integrity Verification (SHA-256)"
            echo '```'
            cat dist/morphe-fetch-${tag}.apk.sha256
            echo '```'
          } > release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.release_info.outputs.tag }}"
          prerelease_opt=""
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            prerelease_opt="--prerelease"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists. Updating release assets and notes..."
            for file in dist/*; do
              asset_name=$(basename "$file")
              gh release delete-asset "$tag" "$asset_name" -y 2>/dev/null || true
              gh release upload "$tag" "$file"
            done
            gh release edit "$tag" \
              --title "Morphe Fetch ${tag}" \
              --notes-file release-notes.md \
              $prerelease_opt
          else
            echo "Creating new release $tag..."
            gh release create "$tag" dist/* \
              --target "${GITHUB_SHA}" \
              --title "Morphe Fetch ${tag}" \
              --notes-file release-notes.md \
              $prerelease_opt
          fi
